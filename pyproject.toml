[project]
name = "pzp-ai"
version = "0.11.0"
description = "Telegram group AI memory assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiogram~=3.31.0",
  "aiosqlite~=0.22.1",
  "alembic~=1.20.1",
  "cryptography~=50.0.2",
  "fastapi~=0.162.1",
  "httpx~=0.28.1",
  "ijson~=3.6.0",
  "numpy~=2.5.4",
  "openai~=3.46.0",
  "orjson~=3.13.0",
  "pydantic-settings~=2.16.2",
  "PyJWT[crypto]~=2.15.1",
  "rich~=15.0.0",
  "sqlalchemy[asyncio]~=2.1.8",
  "structlog~=26.1.0",
  "typer~=0.28.0",
  "uvicorn[standard]~=0.54.0",
]

[project.optional-dependencies]
local = [
  "huggingface-hub~=1.28.0",
  "sentence-transformers~=6.2.0",
  "torch~=2.13.0",
  "transformers~=5.16.0",
]
dev = [
  "freezegun~=1.5.5",
  "httpx2~=2.16.0",
  "pytest~=9.2.0",
  "pytest-asyncio~=1.4.1",
  "respx~=0.23.1",
  "ruff~=0.17.4",
  "ty~=0.0.99",
]

[project.scripts]
pzp-bot = "pzp_ai_bot.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pzp_ai_bot"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
skip-magic-trailing-comma = true

[tool.ruff.lint]
# future-annotations = true
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM", "RUF", "N", "S", "W"]
ignore = ["B008", "S101"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "telegram_live: requires real Telegram credentials and is never run by default",
]

[tool.ty.environment]
python-version = "3.12"

[tool.uv]
compile-bytecode = true
link-mode = "copy"

[tool.uv.pip]
compile-bytecode = true
generate-hashes = true
link-mode = "copy"
