[alembic]
path_separator=os
prepend_sys_path = .
script_location = alembic

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
handlers = console
level = WARN

[logger_sqlalchemy]
handlers =
level = WARN
qualname = sqlalchemy.engine

[logger_alembic]
handlers =
level = INFO
qualname = alembic

[handler_console]
args = (sys.stderr,)
class = StreamHandler
formatter = generic
level = NOTSET

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
