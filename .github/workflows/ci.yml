name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --extra dev,local

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run ty check

      - name: Test
        run: uv run pytest --cov=pzp_ai_bot --cov-branch --cov-report=term-missing

      - name: Migration check
        env:
          DB_URL: sqlite+aiosqlite:///${{ runner.temp }}/pzp-ai-migration-check.db
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: CLI help check
        run: uv run pzp-bot --help

      - name: Doctor check
        run: uv run pzp-bot doctor

  frontend:
    name: Frontend Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Install frontend dependencies and managed runtime
        run: pnpm install --frozen-lockfile

      - name: Verify managed Node runtime
        run: pnpm runtime:check

      - name: Check frontend formatting
        run: pnpm format:check

      - name: Lint frontend
        run: pnpm lint

      - name: Type check frontend
        run: pnpm typecheck

      - name: Test frontend
        run: pnpm test

      - name: Check generated API types
        run: pnpm openapi:check

      - name: Build SSR frontend
        run: pnpm build

      - name: Scan generated frontend for server-only data
        env:
          CONTROL_PLANE_MASTER_KEYS: '{"ci":"cGhhc2UyLWNpLW1hc3Rlci1rZXktdGhhdC1uZXZlci1zaGlwcw=="}'
          DB_URL: sqlite+aiosqlite:///phase2-ci-secret.db
          OPENAI_API_KEY: sk-phase2-ci-secret-that-must-never-ship
          PZP_API_DEV_ORIGIN: https://phase2-ci-internal-api.example
          TELEGRAM_BOT_TOKEN: 123456789:phase2-ci-telegram-secret-that-must-never-ship
          TELEGRAM_OIDC_CLIENT_SECRET: phase2-ci-oidc-secret-that-must-never-ship
          WEBHOOK_SECRET: phase2-ci-webhook-secret-that-must-never-ship
        run: pnpm scan:generated

      - name: Smoke production SSR output
        run: pnpm smoke:ssr

  docker:
    name: Docker Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag pzp-ai:ci .

      - name: Build frontend image
        run: docker build --tag pzp-ai-web:ci ./web

      - name: Run doctor in image
        run: docker run --rm -e AI_PROVIDER=fake -e DB_URL=sqlite+aiosqlite:////tmp/pzp/bot.db -e MEMORY_DIR=/tmp/pzp/memory pzp-ai:ci pzp-bot doctor
